<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit your product review for flux capacitor, power laces, time circuits and more. Rate the product, add installation date, and share your thoughts.">
    <meta name="author" content="Olivia Crawford">
    <title>Product Review | WDD 131</title>
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
        <p>Share your experience with one of our amazing products!</p>
    </header>

    <main>
        <form id="review-form" action="review.html" method="get">
            
            <!-- Product Name -->
            <div class="form-group">
                <label for="product">Product Name <span class="required">*</span></label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    <!-- Options added by JavaScript -->
                </select>
            </div>

            <!-- Overall Rating -->
            <div class="form-group">
                <label>Overall Rating <span class="required">*</span></label>
                <div class="star-rating">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5" title="5 stars">★</label>
                    
                    <input type="radio" id="star4" name="rating" value="4" required>
                    <label for="star4" title="4 stars">★</label>
                    
                    <input type="radio" id="star3" name="rating" value="3" required>
                    <label for="star3" title="3 stars">★</label>
                    
                    <input type="radio" id="star2" name="rating" value="2" required>
                    <label for="star2" title="2 stars">★</label>
                    
                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1" title="1 star">★</label>
                </div>
            </div>

            <!-- Date of Installation -->
            <div class="form-group">
                <label for="install-date">Date of Installation <span class="required">*</span></label>
                <input type="date" id="install-date" name="installDate" required>
            </div>

            <!-- Useful Features -->
            <div class="form-group">
                <label>Useful Features (check all that apply)</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="durability" name="features" value="durability">
                    <label for="durability">Durability</label>
                    
                    <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
                    <label for="ease-of-use">Ease of Use</label>
                    
                    <input type="checkbox" id="performance" name="features" value="performance">
                    <label for="performance">Performance</label>
                    
                    <input type="checkbox" id="innovation" name="features" value="innovation">
                    <label for="innovation">Innovation</label>
                    
                    <input type="checkbox" id="value" name="features" value="value">
                    <label for="value">Value for Money</label>
                </div>
            </div>

            <!-- Written Review -->
            <div class="form-group">
                <label for="review-text">Written Review</label>
                <textarea id="review-text" name="reviewText" rows="5" placeholder="Tell us what you thought... (optional)"></textarea>
            </div>

            <!-- User Name -->
            <div class="form-group">
                <label for="user-name">Your Name (optional)</label>
                <input type="text" id="user-name" name="userName" placeholder="Olivia">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Submit Review</button>
        </form>
    </main>

    <!-- Common Footer -->
    <footer>
        <p>&copy; 2026 Olivia • WDD 131: Dynamic Web Fundamentals • Hawaii, US</p>
        <p><a href="form.html">Back to Form</a></p>
    </footer>

    <script src="scripts/form.js" defer></script>
</body>
</html>
