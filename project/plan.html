<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Your Hike | Hawaii Island Hiking Trails Guide</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <h1>Hawaiʻi Island Trails</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="trails.html">Trails</a></li>
                    <li><a href="safety.html">Safety</a></li>
                    <li><a href="plan.html" class="active">Plan Your Hike</a></li>
                    <li><a href="references.html">References</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section>
            <h2>Plan Your Hike</h2>
            <p>Fill out the form below and we'll help you prepare with an estimated hiking time and packing list.</p>

            <form id="hikeForm">
                <label for="trail">Choose a Trail:</label>
                <select id="trail" required>
                    <option value="">-- Select a Trail --</option>
                    <option value="Kīlauea Iki Trail">Kīlauea Iki Trail (Moderate)</option>
                    <option value="Pololū Valley Trail">Pololū Valley Trail (Moderate)</option>
                    <option value="Papakōlea Green Sand Beach">Papakōlea Green Sand Beach (Hard)</option>
                    <option value="ʻAkaka Falls State Park">ʻAkaka Falls State Park (Easy)</option>
                    <option value="Waipiʻo Valley Lookout Trail">Waipiʻo Valley Lookout Trail (Moderate)</option>
                    <option value="Mauna Kea Summit Area">Mauna Kea Summit Area (Hard)</option>
                </select>

                <label for="hours">How many hours do you want to hike?</label>
                <input type="number" id="hours" min="1" max="12" value="4" required>

                <label for="group">Group Size:</label>
                <select id="group" required>
                    <option value="1">Just me</option>
                    <option value="2">2 people</option>
                    <option value="3">3–4 people</option>
                    <option value="5">5+ people</option>
                </select>

                <button type="submit">Generate My Plan</button>
            </form>

            <!-- Dynamic Results Area -->
            <div id="result"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hawaii Island Hiking Trails Guide • <a href="references.html">References</a></p>
    </footer>

    <script src="scripts/script.js"></script>
</body>
</html>
